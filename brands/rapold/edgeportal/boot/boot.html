:root{

  --fg:#EDF5FF; --muted:#9AADC7; --azure:#009DFF; --sky:#38B8FF; --ice:#A8EDFF;
  --ok:#34D399; --warn:#FBBF24; --bad:#FB7185; --firstglut:#FFA36C; --firstglut-core:#FFE2CC;
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;

  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;cursor:none}
/* Bühne: 16:9, zentriert, füllt den TV. Fassung 5 rechnet alle Grössen in cqw dieser Bühne. */
.tv{position:absolute;inset:0;margin:auto;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:#000;overflow:hidden;container-type:inline-size}
.tv svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.tv .up polygon{fill:var(--azure)}
.tv .lo polygon{fill:var(--ice)}
.tv .ghost polygon{fill:var(--line)}
.tv .seg{stroke:var(--ice);stroke-width:2;transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.tv .segA-m,.tv .stub{stroke:var(--input);stroke-width:2;opacity:0;transition:opacity .5s var(--ease)}
.tv .stub{stroke-dasharray:8 10}
.tv .hair{transition:opacity .9s var(--ease)}
.tv .dot{fill:var(--azure);opacity:0;transition:opacity .4s var(--ease)}
.tv .navy{opacity:0;transition:opacity .6s var(--ease)}
.tv .bloom{opacity:0;transition:opacity 1.3s var(--ease)}
.tv .ghost{opacity:0;transition:opacity .9s var(--ease)}
.tv .plane{transition:transform .9s var(--ease),opacity .9s var(--ease)}
.tv .shift{transform-origin:800px 430px;transition:transform 1.1s var(--ease)}
.tv .gridwrap{transform-origin:800px 450px;transform:scale(.6);opacity:0;transition:transform 1.5s var(--ease),opacity 1.5s var(--ease)}
.tv.s1 .navy,.tv.s1 .dot{opacity:1}
.tv.s2 .segA{transform:scaleX(1)}
/* Durchgang und Empfehlung: Flächen gleiten entlang der Fugenachse */
.glide .up{opacity:0;transform:translate(230px,-122px)}
.glide .lo{opacity:0;transform:translate(-230px,122px)}
.hero.s3 .segB{transform:scaleX(1)}
.hero.s3 .up{opacity:1;transform:none}
.hero.s4 .lo{opacity:1;transform:none}
.hero.s4 .bloom{opacity:1}
.hero.s5 .hair,.hero.s5 .dot{opacity:0}
.hero.offline .segA{opacity:0}
.hero.offline .segA-m,.hero.offline .stub{opacity:1}
.hero.offline .ghost{opacity:.7}
.hero.offline .bloom{opacity:0}
.hero.pair.s5 .shift{transform:translate(-300px,0)}
.hero.s6 .shift{transform:translate(-650px,-310px) scale(.3)}
.tv .ov{position:absolute;opacity:0;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.tv .word{left:0;right:0;top:63%;text-align:center;transform:translateY(1cqw)}
.tv.s5 .word{opacity:1;transform:none}
.hero.pair.s5 .word{transform:translateX(-18.75%)}
.hero.s6 .word{opacity:0}
.wm{display:inline-block;font-weight:700;font-size:3.9cqw;letter-spacing:-.052em;line-height:1.05;padding-bottom:.06em;

.wsub{font-family:var(--mono);font-size:clamp(7px,1.15cqw,22px);color:var(--muted);margin-top:.9cqw;letter-spacing:.04em}
.tv .status{left:6.5%;bottom:6.5%;font-family:var(--mono);font-size:clamp(7px,1.25cqw,28px);color:var(--muted);line-height:1.5}
.tv.s1 .status{opacity:1}
.st-diag{color:var(--input)}
.tv .pairbox{left:62%;top:50%;width:26%;transform:translate(2cqw,-50%);text-align:left}
.hero.pair.s5 .pairbox{opacity:1;transform:translate(0,-50%)}
.pq{font-size:1.55cqw;font-weight:650;letter-spacing:-.02em;margin-bottom:1.1cqw;line-height:1.15}
.qr{background:var(--fg);padding:.7cqw;border-radius:.4cqw;width:72%}
.qr svg{display:block;width:100%;height:auto}
.pcode{font-family:var(--mono);font-size:2cqw;margin-top:1.1cqw;letter-spacing:.08em}
.pcount{font-family:var(--mono);font-size:clamp(7px,1cqw,18px);color:var(--muted)}
.tv .hdr{left:12.4%;top:13.3%;transform:translateY(-50%);font-weight:650;font-size:1.6cqw;letter-spacing:-.03em}

.handoff b{display:block;font-weight:400;font-size:2.8cqw;letter-spacing:-.02em}
.handoff span{font-family:var(--mono);font-size:clamp(7px,1.1cqw,20px);color:var(--muted)}
.hero.s6 .handoff{opacity:1;transition-delay:.5s}
.tv .safe{inset:5%;border:1px dashed rgba(168,237,255,.45);pointer-events:none;transition:opacity .2s}
.tv .safe i{position:absolute;left:.6cqw;top:.4cqw;font-style:normal;font-family:var(--mono);font-size:clamp(7px,.8cqw,14px);color:var(--ice)}
body.show-safe .tv .safe{opacity:1}
/* Systemstart: rapold.io «Der First». firstEngine() rechnet jede Grösse pro Bild, damit die Plymouth-Frames deterministisch exportierbar sind. */
.hero.pre .navy{opacity:1}
.hero.pre .status{opacity:1}
.hero.lvl1.pre:not(.s1) .status{opacity:0}
.first path.c,.first line,.ridgeline line{fill:none;stroke-linecap:round}
.first .scr,.ridgeline .scr,.bloomR{mix-blend-mode:screen}
.fl-halo{stroke:var(--firstglut);stroke-opacity:.55}
.fl-glut{stroke:var(--firstglut)}
.fl-core{stroke:var(--firstglut-core)}
.seam{stroke:var(--azure);stroke-width:1.2}
.plate rect,.plate line{fill:none;stroke:var(--ice);stroke-width:1;vector-effect:non-scaling-stroke}
.plate text{font-family:var(--mono);fill:var(--muted);font-size:6.5px}
.hero.curhold .cur{animation:none}
.hero.curoff .cur{opacity:0;transition:opacity .24s}
.tv .ann{font-family:var(--mono);font-size:clamp(6px,.9cqw,18px);color:var(--muted);white-space:nowrap;transition:opacity .18s}
.ann b{color:var(--ice);font-weight:400;margin-right:.45em}
.ann b.r{margin:0 0 0 .45em}
.tv .a-g{left:27%;top:25.5%}
.tv .a-t{left:60%;top:32.5%}
.tv .a-f{right:58%;top:69%}
.tv .a-b{left:61.5%;top:69.5%}
.hero.lvl3.ann-g .a-g,.hero.lvl4.ann-g .a-g,.hero.lvl5.ann-g .a-g,.hero.lvl4.ann-t .a-t,.hero.lvl5.ann-t .a-t,.hero.lvl4.ann-f .a-f,.hero.lvl5.ann-f .a-f,.hero.lvl4.ann-b .a-b,.hero.lvl5.ann-b .a-b{opacity:1}
.hero .segA,.hero .segA-m{transform-origin:100% 50%}
.hero.s4 .bloomR{opacity:0 !important;transition:opacity 1.3s var(--ease)}

.endorse{display:flex;align-items:center;justify-content:center;gap:.9cqw;margin-top:1.2cqw}
.endorse span{font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;font-size:clamp(7px,1cqw,22px);color:var(--muted)}
.endorse svg{height:1.8cqw;width:8.15cqw;display:block}
.endorse.left{justify-content:flex-start;margin-top:.7cqw}
.word .wsub{margin-top:1.5cqw}

.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46cqw}
.log b{font-weight:500}
.log .old{opacity:.55}
.k-ok{color:var(--ok)} .k-bad{color:var(--bad)} .k-wait{color:var(--muted)} .k-info{color:var(--sky)} .k-ts{color:var(--muted)}
.cur{font-style:normal;color:var(--sky);margin-left:.15em;animation:blink 1s steps(1) infinite}

.hero.lvl2 .log{color:var(--fg)}
.hero.lvl3 .status,.hero.lvl4 .status,.hero.lvl5 .status{top:6.5%;bottom:auto;font-size:clamp(7px,1.1cqw,24px)}
.hero.lvl3 .log,.hero.lvl4 .log{color:var(--fg)}
.hero.lvl5 .log{color:var(--ice);letter-spacing:.04em}
.hero.s6.lvl3 .status,.hero.s6.lvl4 .status,.hero.s6.lvl5 .status{opacity:0}
.hero.lvl4 .wsub,.hero.lvl5 .wsub{color:var(--ice)}
.hero.lvl5 .pq{font-family:var(--mono);font-weight:500;letter-spacing:.06em;font-size:1.3cqw}
.lvl-row{gap:6px}
.lvl-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.btn[aria-checked="true"]{border-color:var(--sky);background:rgba(56,184,255,.12)}
.btn .lv{font-family:var(--mono);color:var(--sky);margin-right:6px}
.top .lockup{margin-left:auto;width:104px;height:23px}

.tv.rm,.tv.rm *{transition:none !important;animation:none !important}

    this.body = q('.rbody'); this.fold = q('.rfold'); this.fa = q('.rfacet-a'); this.fi = q('.rfacet-i'); this.seams = qa('.seam');

  FirstEngine.prototype.frame = function(t){

    op(this.g, t >= FT.firstHide ? 0 : gIn);
    op(this.bloom, t < FT.handoff ? .85 * (rm ? 1 : E_IO(seg(t, 0, FT.bloomInDur))) : .85 - .45 * (rm ? 1 : E_IO(seg(t, FT.handoff, FT.lightsOutDur))));

  function qr(seed){
    var n = 25, out = '', x, y, r = seed;

  // Wortlaut in fünf Stufen. Jede Zeile entspricht einem echten Signal; nur der Ton ändert sich.
  function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  var T = TL.texts.log, SUB = TL.texts.sub, PQ = TL.texts.claimPrompt, HO = TL.texts.handoff;

  // Bühne mit Log, Untertitel und Klassen der Stufen (Engine aus Fassung 5, ohne Timer)

  // Signal-Gates: Jede Stufe erscheint erst, wenn ihr Signal bereit ist, in fester Reihenfolge,
  // nie vor dem Kiosk-Punkt und mindestens minHoldMs nach der vorherigen Stufe. Rein und deterministisch.
  function plan(events, scenarioId){
    var sc = TL.scenarios[scenarioId] || {}, hold = TL.gating.minHoldMs;
    var steps = [ {t:100, key:'boot', step:0}, {t:FT.dock, key:'bootok', replaceLast:true} ];
    var ev = events.slice().sort(function(a, b){ return a.at - b.at; });
    function next(signal, from, value){
      for (var i = 0; i < ev.length; i++){ var e = ev[i];
        if (e.signal === signal && e.at >= from && (value === undefined || (e.value || 'ok') === value)) return e; }
      return null;
    }
    var last = -Infinity, cursor = -Infinity, pairing = null;
    var order = ['kiosk', 'bootstrap', 'network', 'portal', 'pairing', 'handoff'];
    for (var i = 0; i < order.length; i++){
      var st = STAGE[order[i]], e;

          last = tf; cursor = failE.at;

          var td = tf + diag.afterFailMs;
          if (!okE || Math.max(okE.at, last + hold) > td) steps.push({t:td, diagKey:diag.logKey});
          if (!okE) break;
          var tr = Math.max(okE.at, last + hold);

      if (!e) break;

      var ts = Math.max(e.at, last + hold, st.notBeforeMs || 0);
      var step = {t:ts, s:st.index};

  function scenarioId(name){
    if (!name) return TL.defaultScenario;

    if (name === 'none' || name === 'live') return 'live';
    return TL.defaultScenario;

  function scenarioEvents(id, recoverAt){

    var ev = sc.signals.map(function(s){ return {signal:s.signal, value:s.value, at:s.atMs}; });
    if (sc.recover && recoverAt !== null && recoverAt !== undefined && !isNaN(recoverAt))
      sc.recover.signals.forEach(function(s){ ev.push({signal:s.signal, value:s.value, at:recoverAt + s.afterMs}); });
    return ev;
  }

  // Zustand
  var tvEl = document.getElementById('tv-hero');
  if (RM) tvEl.classList.add('rm');
  var hero = new Engine(tvEl), first = new FirstEngine(tvEl);
  var level = Math.max(1, Math.min(5, parseInt(Q.get('level'), 10) || TL.defaultLevel));
  hero.level = first.level = level;
  var scen = scenarioId(Q.get('scenario'));
  var recoverQ = Q.get('recover') !== null ? +Q.get('recover') : null;
  var events = scen === 'live' || Q.get('mode') === 'live' ? [] : scenarioEvents(scen, recoverQ);
  var claimSc = TL.scenarios['erststart-claim'].claim;
  var running = false, raf = 0, t0 = 0, applied = 0, steps = [], gateTimer = 0, started = false;
  if (Q.get('safe') === '1') document.body.classList.add('show-safe');

  function markPx(){
    var r = tvEl.getBoundingClientRect();
    return r.height * (TL.scene.markHeightUnits * 1.9 / TL.scene.viewBox[1]) * (window.devicePixelRatio || 1);
  }
  function updateLit(){
    var l = Q.get('light');
    first.lit = l === 'on' ? true : l === 'off' ? false : markPx() >= TL.corona.minRenderedMarkHeightPx;
    tvEl.dataset.lit = first.lit ? '1' : '0';
  }
  function claimClock(t){
    var claimStep = null;
    steps.forEach(function(s){ if (s.claim && s.t <= t) claimStep = s; });
    if (!claimStep) return;
    var el = Math.max(0, t - claimStep.t), ttl = claimSc.ttlS * 1000;
    var cycle = Math.floor(el / ttl), left = claimSc.ttlS - Math.floor((el % ttl) / 1000);
    var code = claimSc.codes[cycle % claimSc.codes.length];
    tvEl.querySelector('.pcode').textContent = TL.texts.claimCode.replace('{code}', code);
    tvEl.querySelector('.pcount').textContent = TL.texts.claimValidity.replace('{m}', Math.floor(left / 60)).replace('{ss}', String(left % 60).padStart(2, '0'));
  }
  function resetStage(){
    tvEl.classList.add('reset');
    hero.clear(); applied = 0;
    claimClockReset();
  }
  function claimClockReset(){
    tvEl.querySelector('.pcode').textContent = TL.texts.claimCode.replace('{code}', claimSc.codes[0]);
    tvEl.querySelector('.pcount').textContent = TL.texts.claimValidity.replace('{m}', Math.floor(claimSc.ttlS / 60)).replace('{ss}', String(claimSc.ttlS % 60).padStart(2, '0'));
  }

  // Abspielen in Echtzeit: ein Takt pro Bild, Stufen werden zum geplanten Zeitpunkt angewendet.
  function tick(now){
    if (!running) return;
    var t = now - t0;
    first.frame(t);
    while (applied < steps.length && steps[applied].t <= t){ hero.apply(steps[applied]); applied++; }
    claimClock(t);
    tvEl.dataset.t = String(Math.round(t));
    raf = requestAnimationFrame(tick);
  }
  function play(){
    cancelAnimationFrame(raf); clearTimeout(gateTimer); running = true; started = true;
    tvEl.classList.remove('seek');
    resetStage(); updateLit(); steps = plan(events, scen);
    first.frame(0); void tvEl.offsetWidth; tvEl.classList.remove('reset');
    t0 = performance.now(); raf = requestAnimationFrame(tick);
  }
  function now(){ return running ? performance.now() - t0 : 0; }

  // Standbild bei t: First rechnet direkt; CSS-Übergänge der Stufen werden pausiert und auf ihre Zeit gesetzt.
  function seek(t){
    running = false; cancelAnimationFrame(raf); clearTimeout(gateTimer);
    document.getAnimations().forEach(function(a){ a.cancel(); });
    tvEl.classList.add('seek'); resetStage(); updateLit();
    steps = plan(events, scen);
    first.frame(t); void tvEl.offsetWidth;
    tvEl.classList.remove('reset');
    var starts = new Map(), due = steps.filter(function(s){ return s.t <= t; });
    function collect(ts){ document.getAnimations().forEach(function(a){ if (!starts.has(a)){ starts.set(a, ts); a.pause(); } }); }
    function advance(at){
      var live = document.getAnimations();
      starts.forEach(function(ts, a){ if (live.indexOf(a) >= 0) a.currentTime = Math.max(0, at - ts); });
      void tvEl.offsetWidth;
    }
    due.forEach(function(st, i){
      hero.apply(st); applied = i + 1; void tvEl.offsetWidth; collect(st.t);
      advance(i + 1 < due.length ? due[i + 1].t : t);
    });
    claimClock(t);
    tvEl.dataset.t = String(Math.round(t));
  }

  // Statischer Endzustand: reduzierte Bewegung, Plymouth «static» und ?still=end
  function still(){
    running = false; cancelAnimationFrame(raf); clearTimeout(gateTimer);
    tvEl.classList.add('seek'); resetStage(); updateLit();
    steps = plan(events, scen);
    var sc = TL.scenarios[scen], endIdx = sc ? STAGE[sc.staticEndStage].index : 6;
    steps.forEach(function(st){ if (!(st.s > endIdx)) hero.apply(st); });
    first.clear(); claimClockReset();
    void tvEl.offsetWidth; tvEl.classList.remove('reset');
    tvEl.dataset.t = 'end';
  }

  // Signale setzen: window.edgeportalBoot.signal('portal'), signal('pairing', 'claim'), signal('network', 'fail')
  function signal(name, value){
    if (SIGNALS.indexOf(name) < 0) throw new Error('Unbekanntes Signal: ' + name + '. Bekannt: ' + SIGNALS.join(', '));
    if (name === 'cec-on'){ if (!running) play(); return; }
    if (!running) play();
    events.push({signal:name, value:value, at:now()});
    steps = plan(events, scen);
  }
  function recover(){
    var sc = TL.scenarios['netz-fehlt'], at = now();
    sc.recover.signals.forEach(function(s){ events.push({signal:s.signal, value:s.value, at:at + s.afterMs}); });
    steps = plan(events, scen);
  }

  window.edgeportalBoot = {
    timeline: TL, signals: SIGNALS.slice(), plan: plan,
    signal: signal, recover: recover, play: play, seek: seek, still: still,
    state: function(){ return { scenario: scen, level: level, reducedMotion: RM, lit: first.lit, t: now(), running: running, applied: applied, steps: steps.slice(), events: events.slice() }; }
  };

  function boot(){
    var tq = Q.get('t');
    if (Q.get('still') === 'end') { still(); }
    else if (tq !== null) { seek(Math.max(0, +tq || 0)); }
    else if (Q.get('gate') === 'cec') {
      // Ruhebild halten, bis der TV «on» meldet; Fallback aus der Zeitachse
      resetStage(); updateLit(); first.frame(0); tvEl.classList.remove('reset');
      gateTimer = setTimeout(function(){ if (!started) play(); }, TL.gate.startFallbackMs);
    }
    else play();
    document.documentElement.dataset.ready = '1';
  }
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(function(r){ setTimeout(r, 1500); })]).then(boot);
})();
</script>
</body>
</html>
